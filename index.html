<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIG College Notes — Semester 1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="brand">
          <p class="kicker">Symbiosis Institute of Geoinformatics, Pune</p>
          <h1>SIG College Notes</h1>
          <p class="programme">
            M.Sc. Data Science and Spatial Analytics · Semester 1
          </p>
        </div>
        <div class="top-actions">
          <div class="session">
            <p class="session-label">Logged in as</p>
            <p id="sessionName" class="session-name"></p>
          </div>
          <button type="button" id="logoutBtn" class="btn btn-secondary">
            Logout
          </button>
        </div>
      </header>

      <p class="disclaimer">
        Study helper only — not official SIG LMS content.
      </p>

      <nav class="tabs" aria-label="Semester">
        <button type="button" class="tab is-active" aria-current="page">
          Semester 1
        </button>
      </nav>

      <div class="toolbar">
        <label class="search">
          <span class="sr-only">Search subjects</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Search subjects…"
            autocomplete="off"
          />
        </label>
        <p id="status" class="status" role="status"></p>
      </div>

      <main id="cards" class="cards"></main>

      <footer class="foot">
        Notes stay in this browser.
      </footer>
    </div>

    <div class="chatbot" id="chatbot">
      <button type="button" class="chatbot-toggle" id="chatToggle" aria-expanded="false">
        Study chat
      </button>
      <section class="chatbot-panel" id="chatPanel" hidden>
        <header class="chatbot-head">
          <div>
            <p class="chatbot-title">SIG Study Bot</p>
            <p class="chatbot-sub">Ask about Semester 1 subjects or how to use notes.</p>
          </div>
          <button type="button" class="btn-ghost chatbot-close" id="chatClose">Close</button>
        </header>
        <div class="chatbot-messages" id="chatMessages" aria-live="polite"></div>
        <form class="chatbot-form" id="chatForm">
          <input
            id="chatInput"
            type="text"
            placeholder="Ask something…"
            autocomplete="off"
            required
          />
          <button type="submit" class="btn">Send</button>
        </form>
      </section>
    </div>

    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="chatbot.js"></script>
  </body>
</html>
