<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — SIG College Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-art" aria-hidden="true"></div>
    <div class="page login-page">
      <section class="login-screen">
        <div class="login-card">
          <div class="login-brand-row">
            <div class="brand-mark" aria-hidden="true">SIG</div>
            <div>
              <h1 class="login-title">College Notes</h1>
              <p class="login-lead">Semester 1 · Name + PRN</p>
            </div>
          </div>
          <form id="loginForm" class="login-form" novalidate>
            <label class="field">
              <span>Name</span>
              <input
                id="loginName"
                name="name"
                type="text"
                placeholder="Enter your name"
                autocomplete="username"
                required
              />
            </label>
            <label class="field">
              <span>PRN</span>
              <input
                id="loginPrn"
                name="prn"
                type="password"
                placeholder="Enter your PRN"
                autocomplete="current-password"
                required
              />
            </label>
            <div class="login-actions">
              <button type="submit" class="btn" data-mode="login" id="loginBtn">
                Login
              </button>
              <button type="submit" class="btn btn-signup" data-mode="signup" id="signupBtn">
                Sign up
              </button>
            </div>
            <p id="loginError" class="login-error" role="status"></p>
            <p class="login-hint">
              Enter Name and PRN, then tap Sign up to create your account and open
              the home page.
            </p>
          </form>
        </div>
      </section>
    </div>
    <script src="auth.js?v=3"></script>
    <script src="login.js?v=3"></script>
  </body>
</html>
