<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — SIG College Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-art" aria-hidden="true"></div>
    <div class="page login-page">
      <section class="login-screen">
        <div class="login-shell">
          <aside class="login-aside">
            <div class="brand-mark large" aria-hidden="true">SIG</div>
            <h1>College Notes</h1>
            <p class="programme">
              Your Semester 1 study shelf — notes, files, and subjects in one quiet place.
            </p>
          </aside>
          <div class="login-card">
            <p class="kicker">Student login</p>
            <h2 class="login-title">Welcome back</h2>
            <p class="login-lead">
              Sign in with your name and PRN to open your notes.
            </p>
            <form id="loginForm" class="login-form">
              <label class="field">
                <span>Name</span>
                <input
                  id="loginName"
                  type="text"
                  placeholder="Your student name"
                  autocomplete="username"
                  required
                />
              </label>
              <label class="field">
                <span>PRN</span>
                <input
                  id="loginPrn"
                  type="password"
                  placeholder="Your PRN"
                  autocomplete="current-password"
                  required
                />
              </label>
              <button type="submit" id="loginBtn" class="btn">
                Continue to notes
              </button>
              <p id="loginError" class="login-error" role="status"></p>
              <p class="login-hint">
                Name is your username, PRN is your password. First login creates
                your account in this browser only.
              </p>
            </form>
          </div>
        </div>
      </section>
    </div>
    <script src="auth.js"></script>
    <script src="login.js"></script>
  </body>
</html>
